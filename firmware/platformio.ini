[platformio]
default_envs = waveshare_esp32_s3_matrix

[env]
platform = espressif32
framework = arduino
test_build_src = yes
monitor_speed = 115200
build_flags =
  -D LED_COUNT=64
  -D MATRIX_WIDTH=8
  -D MATRIX_HEIGHT=8
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3

[env:waveshare_esp32_s3_matrix]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LED_DATA_PIN=14
  -D LED_COLOR_ORDER=NEO_RGB
  -D MATRIX_SERPENTINE=0
  -D MATRIX_ROTATION=180

[env:esp32_wroom_32d_ws2812b_64]
board = esp32dev
upload_protocol = custom
upload_speed = 115200
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/upload_wroom.py" --port "$UPLOAD_PORT" --baud "$UPLOAD_SPEED" --firmware "$SOURCE"
build_flags =
  ${env.build_flags}
  -D LED_DATA_PIN=16
  -D LED_COLOR_ORDER=NEO_GRB
  -D MATRIX_SERPENTINE=1
  -D MATRIX_ROTATION=0
